name: Tests
on:
  pull_request:
  workflow_call:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: 0.13.9
          enable-cache: true
      - run: uv python install 3.15
      - name: Check release and project versions
        run: |
          python3 - <<'PY'
          import pathlib
          import tomllib

          release_version = pathlib.Path("version.txt").read_text().strip()
          project_version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          assert release_version == project_version, (release_version, project_version)
          PY
      - run: uv sync --locked --python 3.15
      - name: Run tests when the repository has test files
        run: |
          if [ -d tests ] && find tests -type f -name 'test_*.py' -print -quit | grep -q .; then
            uv run --python 3.15 pytest -q
          else
            echo "No test files are present on this ref; skipping pytest."
          fi
      - run: uv build --python 3.15
