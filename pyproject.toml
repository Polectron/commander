[project]
name = "commander"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Polectron", email = "polectron@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "aiosqlite>=0.22.1",
    "pydantic>=2.14.4",
    "pypika>=0.51.1",
]

[project.scripts]
commander = "commander:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
